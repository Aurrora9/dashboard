<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>业务分析仪表盘</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,'Microsoft YaHei','PingFang SC',sans-serif;min-height:100vh;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,#0d47a1 0%,#1a73e8 40%,#42a5f5 100%);overflow:hidden}
.container{text-align:center;animation:fadeIn .8s ease}
@keyframes fadeIn{from{opacity:0;transform:translateY(30px)}to{opacity:1;transform:translateY(0)}}
.logo{width:80px;height:80px;margin:0 auto 24px;background:rgba(255,255,255,.15);border-radius:20px;display:flex;align-items:center;justify-content:center;backdrop-filter:blur(10px)}
.logo svg{width:44px;height:44px}
h1{color:#fff;font-size:28px;font-weight:600;margin-bottom:8px;letter-spacing:1px}
.subtitle{color:rgba(255,255,255,.7);font-size:15px;margin-bottom:36px}
.btn{display:inline-block;padding:14px 48px;background:#fff;color:#1a73e8;font-size:16px;font-weight:600;border-radius:12px;text-decoration:none;box-shadow:0 4px 20px rgba(0,0,0,.15);transition:all .3s ease;cursor:pointer;border:none}
.btn:hover{transform:translateY(-2px);box-shadow:0 8px 30px rgba(0,0,0,.25);background:#f0f6ff}
.btn:active{transform:translateY(0)}
.info{color:rgba(255,255,255,.5);font-size:12px;margin-top:40px}
.particles{position:fixed;top:0;left:0;width:100%;height:100%;pointer-events:none}
.particle{position:absolute;background:rgba(255,255,255,.08);border-radius:50%;animation:float linear infinite}
@keyframes float{0%{transform:translateY(100vh) rotate(0deg);opacity:0}10%{opacity:1}90%{opacity:1}100%{transform:translateY(-10vh) rotate(720deg);opacity:0}}
</style>
</head>
<body>
<div class="particles" id="particles"></div>
<div class="container">
  <div class="logo">
    <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/>
      <rect x="3" y="14" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/>
    </svg>
  </div>
  <h1>业务分析仪表盘</h1>
  <p class="subtitle">一线人员业务能力动态分析系统</p>
  <a class="btn" href="dashboard.html?v=20260801b">进入仪表盘</a>
  <p class="info">高邮电信 | G.Y.T</p>
</div>
<script>
(function(){
  var c=document.getElementById('particles');
  for(var i=0;i<12;i++){
    var p=document.createElement('div');p.className='particle';
    var s=Math.random()*30+10;
    p.style.width=s+'px';p.style.height=s+'px';
    p.style.left=Math.random()*100+'%';
    p.style.animationDuration=(Math.random()*15+10)+'s';
    p.style.animationDelay=(Math.random()*10)+'s';
    c.appendChild(p);
  }
  setTimeout(function(){location.href='dashboard.html?v=20260801b'},3000);
})();
</script>
</body>
</html>

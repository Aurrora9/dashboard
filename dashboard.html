function initSearchSelect(inputId, dropdownId, optionsGetter, onSelect) {
  var input = document.getElementById(inputId);
  var dropdown = document.getElementById(dropdownId);

  function renderList(filter) {
    var items = optionsGetter();
    var html = '';
    items.forEach(function(item) {
      var val = item.val || '';
      var label = item.label || item;
      if (typeof item === 'string') { val = item; label = item || 'ȫ��'; }
      if (filter && label.toLowerCase().indexOf(filter.toLowerCase()) === -1) return;
      var isActive = input._selectedVal === val ? ' active' : '';
      html += '<div class="search-select-item' + isActive + '" data-val="' + val + '">' + label + '</div>';
    });
    if (!html) html = '<div class="search-select-empty">��ƥ��</div>';
    dropdown.innerHTML = html;
  }

  input.addEventListener('focus', function() {
    input.select();
    renderList(input.value === input._displayLabel ? '' : input.value);
    dropdown.classList.add('open');
  });

  input.addEventListener('input', function() {
    renderList(input.value);
    if (!dropdown.classList.contains('open')) dropdown.classList.add('open');
  });

  dropdown.addEventListener('click', function(e) {
    var item = e.target.closest('.search-select-item');
    if (!item) return;
    var val = item.getAttribute('data-val');
    var label = item.textContent;
    input._selectedVal = val;
    input._displayLabel = label;
    input.value = label;
    dropdown.classList.remove('open');
    if (onSelect) onSelect(val);
  });

  document.addEventListener('click', function(e) {
    if (!input.contains(e.target) && !dropdown.contains(e.target)) {
      dropdown.classList.remove('open');
      // ʧ��ʱ�ָ���ѡֵ��ʾ
      if (input._displayLabel) input.value = input._displayLabel;
    }
  });
}

// �����������ռ�ͬ����Աά��ֵ������min-max��һ���÷ֺ����ֵ
// ���� { dimVals: {dim: [values]}, radarScores: {dim: score}, dimAvg: {dim: avg}, personalVals: {dim: val} }
function computeRadarScores(emp, peerNos) {
  var RADAR_DIMS_LIST = ['������չ','������չ','FTTR��չ','�ں��ײ�','�ն˺�Լ','���ֲ���','���׷�չ','�����׸�'];
  var DIM_TO_DWM = {'������չ':'����','������չ':'����','FTTR��չ':null,'�ں��ײ�':'�ں��ײ�','�ն˺�Լ':'�ն˺�Լ','���ֲ���':'��Ч����','���׷�չ':'��������','�����׸�':'�����׸�'};
  var dateKeys = getDateRange();
  var isMultiDate = dateKeys.length > 1;
  var aggEmps = isMultiDate ? getAggregatedEmployees(peerNos, dateKeys) : null;

  var dimVals = {};
  /* dim_personal removed, using getDimPersonal */
  RADAR_DIMS_LIST.forEach(function(dim) {
    dimVals[dim] = [];
    var dwmKey = DIM_TO_DWM[dim];
    peerNos.forEach(function(k) {
      var e = aggEmps ? aggEmps[k] : EMPLOYEES[k];
      if (!e) return;
      var v = 0;
      if (dwmKey && e.dwm && e.dwm[dwmKey]) v = e.dwm[dwmKey].month || 0;
      else v = getDimPersonal(e, dim);
      dimVals[dim].push(v);
    });
  });

  var radarScores = {};
  var dimAvg = {};
  var personalVals = {};
  RADAR_DIMS_LIST.forEach(function(dim) {
    var myVal = getDimPersonal(emp, dim);
    var dwmKey = DIM_TO_DWM[dim];
    if (dwmKey && emp.dwm && emp.dwm[dwmKey]) myVal = emp.dwm[dwmKey].month || 0;
    personalVals[dim] = myVal;
    var vals = dimVals[dim];
    var gMin = vals.length > 0 ? Math.min.apply(null, vals) : 0;
    var gMax = vals.length > 0 ? Math.max.apply(null, vals) : 0;
    if (gMax === gMin) {
      radarScores[dim] = myVal > 0 ? 50 : 0;
    } else {
      radarScores[dim] = (myVal - gMin) / (gMax - gMin) * 100;
    }
    radarScores[dim] = Math.round(radarScores[dim] * 10) / 10;
    var avg = vals.length > 0 ? vals.reduce(function(a,b){return a+b;},0) / vals.length : 0;
    dimAvg[dim] = Math.round(avg * 100) / 100;
  });

  return { dimVals: dimVals, radarScores: radarScores, dimAvg: dimAvg, personalVals: personalVals };
}

    {col: '���ն˺�Լ', label: '�ն˺�Լ', dwmKey: '�ն˺�Լ'},
    {col: '����Ч����', label: '��Ч����', dwmKey: '��Ч����'},
    {col: '�´�����ֵ��Ч����', label: '������ֵ����', dwmKey: null},
    {col: '�¿�����Ч����', label: '���˻���', dwmKey: null},
    {col: '�¿�����������', label: '��������', dwmKey: '��������'},
    {col: '�´����׸�', label: '�����׸�', dwmKey: '�����׸�'},
    {col: '��plus��Ա', label: 'Plus��Ա', dwmKey: null}
  ];

  var ranks = {};
  var groupAvg = {};
  var dateKeys = getDateRange();
  var isMultiDate = dateKeys.length > 1;
  var aggEmps = isMultiDate ? getAggregatedEmployees(peerNos, dateKeys) : null;

  // ȡ��Ա��ͬ������
  RANK_COLS.forEach(function(rc) {
    // ��dwmȡ�¶�ֵ����dwmKeyʱ���˵�dim_personal
    var getVal = function(e) {
      if (!e) return 0;
      var key = rc.dwmKey;
      if (key && e.dwm && e.dwm[key]) return e.dwm[key].month || 0;
      // ��dwmKey��ά��ʹ��getDimPersonal
      if (!key) return getDimPersonal(e, rc.label + '��չ');
      return 0;
    };

    // �ռ�ͬ��������Ա��ֵ
    var vals = [];
    var myVal = getVal(emp);
    peerNos.forEach(function(k) {
      var e = aggEmps ? aggEmps[k] : EMPLOYEES[k];
      if (!e) return;
      vals.push(getVal(e));
    });

    // ��������myVal�������+1
    var rank = 1;
    vals.forEach(function(v) { if (v > myVal) rank++; });
    var total = vals.length;
    var avg = total > 0 ? vals.reduce(function(a,b){return a+b;},0) / total : 0;

    ranks[rc.label] = {rank: rank, total: total, value: myVal};
    groupAvg[rc.label] = Math.round(avg * 10) / 10;
  });

  return {ranks: ranks, groupAvg: groupAvg, peerCount: peerNos.length};
}

function getDateRange() {
  var startVal = document.getElementById('dateStart').value;
  var endVal = document.getElementById('dateEnd').value;
  var start = startVal || ALL_DATES[ALL_DATES.length - 1]; // ����
  var end = endVal || ALL_DATES[0]; // ����
  if (start > end) { var t = start; start = end; end = t; }
  var dates = ALL_DATES.filter(function(d) { return d >= start && d <= end; });
  return dates;
}

function getAggregatedEmployees(staffNos, dateKeys) {
  var BIZ_KEYS = ['��Ч����','����','����','�ں��ײ�','�ն˺�Լ','��������','�����׸�'];
  var result = {};
  if (dateKeys.length <= 1) {
    // �����ڣ�ֱ�ӷ��ص�ǰEMPLOYEES����
    staffNos.forEach(function(k) {
      var e = EMPLOYEES[k];
      if (e) result[k] = e;
    });
    return result;
  }
  // �����ڣ�����ÿ����Ա�ڷ�Χ���������ڵ�����
  var allData = {};
  dateKeys.forEach(function(d) {
    var dd = ALL_DATE_DATA[d];
    if (!dd || !dd.employees) return;
    staffNos.forEach(function(k) {
      var e = dd.employees[k];
      if (!e) return;
      if (!allData[k]) {
        allData[k] = { staff_nm: e.staff_nm, store_name: e.store_name, store_type: e.store_type, staff_category: e.staff_category, branch: e.branch, filter_group: e.filter_group, dwm: {}, scoreSum: 0, scoreCnt: 0, training: '', suspected_frozen: false, _frozenCount: 0 };
        BIZ_KEYS.forEach(function(bk) { allData[k].dwm[bk] = { day: 0, week: 0, month: 0 }; });
      }
      var a = allData[k];
      // ҵ��ֵȡ�ϼ�
      BIZ_KEYS.forEach(function(bk) {
        var dwm = e.dwm ? e.dwm[bk] : null;
        a.dwm[bk].month += dwm ? dwm.month : 0;
      });
      // �����״�÷������ۺ����֣���̬���㣩
      var rScore = computeRadarScores(e, staffNos);
      var rKeys = Object.keys(rScore.radarScores);
      var rAvg = 0;
      rKeys.forEach(function(d) { rAvg += rScore.radarScores[d]; });
      a.scoreSum += rKeys.length > 0 ? rAvg / rKeys.length : 0;
      a.scoreCnt++;
      // ȡ�������ڵ���ѵ����
      if (e.training) a.training = e.training;
      // ���ƶ���ͳ��
      if (e.suspected_frozen) a._frozenCount = (a._frozenCount || 0) + 1;
    });
  });
  // ���ƶ����ж�
  Object.keys(allData).forEach(function(k) {
    var a = allData[k];
    // ����������ȫ�����ڶ����ƶ��ᣬ�ű��Ϊ���ƶ���
    a.suspected_frozen = a._frozenCount >= dateKeys.length;
    delete a._frozenCount;
  });
  // αװΪ��׼employee��ʽ
  staffNos.forEach(function(k) {
    if (allData[k]) {
      allData[k]._avgScore = allData[k].scoreCnt > 0 ? allData[k].scoreSum / allData[k].scoreCnt : 0;
      result[k] = allData[k];
    }
  });
  return result;
}

    content = negList.length > 0 ? negList.join('��') : '�޲���Ϊ����Ա';
  } else {
    title = key + ' - �޲�����Ա';
    content = zeroList.length > 0 ? zeroList.join('��') : 'ȫ����Ա���в���';
  }
  // ����
  var overlay = document.createElement('div');
  overlay.id = 'zeroStaffOverlay';
  overlay.style.cssText = 'position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.4);z-index:9999;display:flex;align-items:center;justify-content:center;';
  var modal = document.createElement('div');
  modal.style.cssText = 'background:#fff;border-radius:12px;padding:24px;max-width:480px;width:90%;box-shadow:0 8px 32px rgba(0,0,0,0.2);';
  modal.innerHTML = '<h3 style="margin:0 0 12px 0;font-size:16px;color:var(--text);">' + title + '</h3>' +
    '<p style="margin:0 0 16px 0;font-size:14px;color:var(--text2);line-height:1.8;word-break:break-all;">' + content + '</p>' +
    '<div style="text-align:right;"><button id="zeroStaffCloseBtn" style="padding:6px 20px;border:1px solid var(--border);border-radius:6px;background:#fff;cursor:pointer;font-size:14px;color:var(--text);">�ر�</button></div>';
  overlay.onclick = function(ev) { if (ev.target === overlay) overlay.remove(); };
  overlay.appendChild(modal);
  document.body.appendChild(overlay);
  document.getElementById('zeroStaffCloseBtn').onclick = function() { overlay.remove(); };
}

function renderTraining(emp) {
  var box = document.getElementById('trainingBox');
  var html = '';
  var radar = computeRadarScores(emp, window._peerNos || getFilteredStaffNos()).radarScores;
  /* dim_personal removed */

  // ʹ�ù����������㶯̬���ֵ
  var peerNos = window._peerNos || getFilteredStaffNos();
  var scoreResult = computeRadarScores(emp, peerNos);
  var dimA = scoreResult.dimAvg;
  var personalVals = scoreResult.personalVals;

  // Ҳ�ö�̬�״�÷�
  var dynamicRadar = window._dynamicRadarScores || {};

  var strongs = [];
  var weaks = [];
  var midRange = [];
  Object.keys(radar).forEach(function(dim) {
    var pv = personalVals[dim] !== undefined ? personalVals[dim] : 0;
    var av = dimA[dim] || 0;
    var score = dynamicRadar[dim] !== undefined ? dynamicRadar[dim] : radar[dim];
    if (pv > av) {
      strongs.push({dim:dim, score:score, pv:pv, av:av});
    } else if (pv < av) {
      weaks.push({dim:dim, score:score, pv:pv, av:av});
    } else {
      midRange.push({dim:dim, score:score, pv:pv, av:av});
    }
  });

  if (strongs.length > 0) {
    html += '<div style="margin-bottom:12px"><b style="color:#34a853;">��������</b>';
    strongs.forEach(function(s) { html += '<span class="badge badge-good" style="margin-right:6px">' + s.dim + ' (' + fmtNum(s.pv) + '����ֵ' + fmtNum(s.av) + ')</span>'; });
    html += '</div>';
  }
  if (weaks.length > 0) {
    html += '<div style="margin-bottom:12px"><b style="color:#ea4335;">��������</b>';
    weaks.forEach(function(s) {
      var cls = s.score < 30 ? 'badge-bad' : 'badge-warn';
      html += '<span class="badge ' + cls + '" style="margin-right:6px">' + s.dim + ' (' + fmtNum(s.pv) + '����ֵ' + fmtNum(s.av) + ')</span>';
    });
    html += '</div>';
  }
  if (midRange.length > 0) {
    html += '<div style="margin-bottom:12px"><b style="color:var(--text);">��ƽ����</b>';
    midRange.forEach(function(s) { html += '<span style="display:inline-block;margin-right:6px;padding:2px 8px;border-radius:4px;font-size:12px;background:#e8f0fe;color:#1a73e8;">' + s.dim + ' (' + fmtNum(s.pv) + ')</span>'; });
    html += '</div>';
  }

  html += '<div style="margin-top:8px"><b>�������ѵ���飺</b></div>';
  html += emp.training;
  box.innerHTML = html;
}
